# Release Workflow
#
# This repo is a private, unpublished browser extension - no npm registry
# publish, ever. Changesets normally skips both versioning and tagging for
# any package marked "private": true, but .changeset/config.json sets
# privatePackages: { version: true, tag: true } (the same setting our other
# private packages use), which tells it to still bump the version, write
# CHANGELOG.md, and create a git tag/GitHub Release - it just never attempts
# an actual `npm publish`. `npm run release` (`changeset publish`) reports
# "no unpublished projects" for the private-publish part and that's expected,
# not a failure.
#
# How it works:
# 1. Triggers on changes to .changeset/, src/, or package files on main
# 2. Uses Changesets to detect whether there's a version bump pending
# 3. If changesets are present, opens/updates a "Version Packages" PR
# 4. When that PR is merged, changesets/action tags + creates the GitHub
#    Release (from privatePackages.tag), then this workflow zips both
#    dist/chrome and dist/firefox and uploads them as assets on that release

name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # To create releases, tags, and upload release assets
      pull-requests: write # To create pull requests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      # Build before releasing so a broken build blocks the release the same
      # way it blocks a PR, and so dist/ is current for packaging below.
      - name: Build
        run: npm run build

      # Changesets Action - The Core of Our Release System
      #
      # This action has two modes:
      # 1. If changesets are present, it creates a "Version Packages" pull request.
      # 2. When the "Version Packages" PR is merged, it runs the `publish` command,
      #    tags the release, and creates the GitHub Release (privatePackages.tag).
      - name: Create Release Pull Request or Tag Release
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      # Only runs once the Version Packages PR is merged and a release was
      # actually tagged this run - not on every push to main, and not on the
      # runs that only open/update that PR.
      - name: Package extension zips
        if: steps.changesets.outputs.published == 'true'
        run: npm run package-extension

      - name: Upload release assets
        if: steps.changesets.outputs.published == 'true'
        run: gh release upload "v$(node -p "require('./package.json').version")" release-zips/*.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
